<div class="body-overlay"></div>
<button aria-label="Theme Customization Button" class="theme-customization__button w-48-px h-48-px bg-primary-600 text-white rounded-circle d-flex justify-content-center align-items-center position-fixed end-0 bottom-0 mb-40 me-40 text-2xxl bg-hover-primary-700" type="button">

<i class="ri-computer-line"></i>
</button>
</div>
</div>

<span><i class="ri-align-item-left-line"></i></span>
<span class="h6 text-sm font-medium mb-0">LTR</span>
</button>
<button aria-label="RTL" class="theme-setting-item__btn rtl-mode-btn d-flex align-items-center justify-content-center gap-2 h-56-px rounded-3 text-xl" type="button">

</button>
</div>
</div>

<span class="fw-medium mt-1" style="color: #25A194;">Base</span>

document.querySelector('.submit-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorContainer = document.getElementById('errorContainer');
    errorContainer.classList.add('d-none');
    errorContainer.innerHTML = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
        const result = await window.EduAiQAPI.login(username, password);

            window.location.href = '/dashboard/';

        }
