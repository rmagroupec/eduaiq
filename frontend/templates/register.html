<body>
    <div class="register-container">
        <div class="register-card">
            <!-- Logo -->
            <div class="logo">
                <img alt="EduAiQ Logo" src="{% static 'admin_assets/images/logo.png' %}" style="max-height: 50px;"/>
            </div>

            <!-- Header -->
            <div class="register-header">
                <h2>Create Account 🚀</h2>
                <p>Join EduAiQ and start learning today</p>
            </div>

            <!-- Error Alert -->
            <div id="errorAlert" class="alert alert-danger"></div>

            <!-- Success Alert -->
            <div id="successAlert" class="alert alert-success"></div>

            <!-- Register Form -->
            <form id="registerForm" method="POST">
                {% csrf_token %}

                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username" 
                        required
                        autocomplete="username"
                    />
                    <small>3-30 characters, letters, numbers, underscore only</small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    />
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="Enter your phone number" 
                        required
                        autocomplete="tel"
                    />
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password" 
                            required
                            autocomplete="new-password"
                        />
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword('password')"
                            aria-label="Toggle password visibility"
                        >
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                    <small>At least 8 characters with letters and numbers</small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm password" 
                            required
                            autocomplete="new-password"
                        />
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword('confirmPassword')"
                            aria-label="Toggle password visibility"
                        >
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="form-check">
                    <input 
                        type="checkbox" 
                        id="terms" 
                        name="terms" 
                        required
                    />
                    <label for="terms">
                        I agree to the <a href="/legal-notice/" target="_blank">Terms & Conditions</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-register" id="registerBtn">
                    Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="register-footer">
                <p>
                    Already have an account? 
                    <a href="{% url 'login' %}">Log in here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'admin_assets/js/lib/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'admin_assets/js/lib/bootstrap.bundle.min.js' %}"></script>

    <script>
        // Django-resolved URLs, safe to use inside JS
        const LOGIN_URL = "{% url 'login' %}";
        const MY_LEARNING_URL = "{% url 'my_learning' %}";

        // Get CSRF token from form
        function getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }

        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = field.parentElement.querySelector('.toggle-password i');

            if (field.type === 'password') {
                field.type = 'text';
                btn.classList.remove('ri-eye-line');
                btn.classList.add('ri-eye-off-line');
            } else {
                field.type = 'password';
                btn.classList.remove('ri-eye-off-line');
                btn.classList.add('ri-eye-line');
            }
        }

        // Show alert
        function showAlert(type, message) {
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');

            if (type === 'error') {
                errorAlert.textContent = message;
                errorAlert.classList.add('show');
                successAlert.classList.remove('show');
                // Scroll to alert
                errorAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (type === 'success') {
                successAlert.textContent = message;
                successAlert.classList.add('show');
                errorAlert.classList.remove('show');
                // Scroll to alert
                successAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Hide alert
        function hideAlert() {
            document.getElementById('errorAlert').classList.remove('show');
            document.getElementById('successAlert').classList.remove('show');
        }

        // Handle registration form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');

            // Validation
            if (!username || !email || !phone || !password || !confirmPassword) {
                showAlert('error', '❌ Please fill in all fields');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('error', '❌ Passwords do not match');
                return;
            }

            if (password.length < 8) {
                showAlert('error', '❌ Password must be at least 8 characters');
                return;
            }

            if (username.length < 3) {
                showAlert('error', '❌ Username must be at least 3 characters');
                return;
            }

            // Show loading state
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner-border"></span>Creating account...';

            try {
                const response = await fetch('http://localhost:8000/accounts/signup/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        phone: phone,
                        password: password
                    })
                });

                const data = await response.json();
                console.log('API Response:', data);

                if (data.success) {
                    // ✅ Registration successful
                    showAlert('success', '✅ Account created successfully! Redirecting to login...');

                    // Store success message in localStorage
                    localStorage.setItem('registration_success', 'true');
                    localStorage.setItem('registered_username', username);

                    // Clear form
                    document.getElementById('registerForm').reset();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = LOGIN_URL;
                    }, 2000);

                } else {
                    // ❌ Registration failed
                    let errorMsg = '❌ Registration failed';

                    if (data.errors) {
                        const errors = Object.values(data.errors).flat();
                        errorMsg = '❌ ' + errors.join(', ');
                    } else if (data.error) {
                        errorMsg = '❌ ' + data.error;
                    }

                    showAlert('error', errorMsg);
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = 'Create Account';
                }

            } catch (error) {
                console.error('Registration error:', error);
                showAlert('error', '❌ Connection error. Please check your internet and try again.');
                registerBtn.disabled = false;
                registerBtn.innerHTML = 'Create Account';
            }
        });

        // Hide alerts when user starts typing
        document.getElementById('username').addEventListener('input', hideAlert);
        document.getElementById('email').addEventListener('input', hideAlert);
        document.getElementById('phone').addEventListener('input', hideAlert);
        document.getElementById('password').addEventListener('input', hideAlert);
        document.getElementById('confirmPassword').addEventListener('input', hideAlert);

        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('is_authenticated') === 'true') {
                // Redirect already logged in users
                window.location.href = MY_LEARNING_URL;
            }
        });
    </script>
</body>
</html> -->
