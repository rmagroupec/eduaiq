{% load static %}

<div class="navbar-header shadow-1">
    <div class="row align-items-center justify-content-between">

        <div class="col-auto">
            <div class="d-flex flex-wrap align-items-center gap-4">

                <button type="button" class="sidebar-mobile-toggle"
                    aria-label="Sidebar Mobile Toggler Button">
                    <iconify-icon icon="heroicons:bars-3-solid" class="icon"></iconify-icon>
                </button>

                <form class="navbar-search">
                    <input type="text" class="bg-transparent"
                        name="search"
                        placeholder="Search">
                    <iconify-icon icon="ion:search-outline" class="icon"></iconify-icon>
                </form>

            </div>
        </div>

        <div class="col-auto">
            <div class="d-flex flex-wrap align-items-center gap-3">



                <!-- Theme Toggle -->
                <button type="button"
                    data-theme-toggle
                    class="w-40-px h-40-px bg-neutral-200 rounded-circle d-flex justify-content-center align-items-center"
                    aria-label="Dark & Light Mode Button">
                </button>

                <!-- Language -->
                <div class="dropdown d-inline-block">

                    <button
                        class="has-indicator w-40-px h-40-px bg-neutral-200 rounded-circle d-flex justify-content-center align-items-center"
                        type="button"
                        data-bs-toggle="dropdown">

                        <img src="{% static 'admin_assets/images/flags/flag1.png' %}"
                            class="w-24 h-24 rounded-circle"
                            alt="Language">

                    </button>

                    <div class="dropdown-menu dropdown-menu-sm to-top">

                        <div class="py-12 px-16 radius-8 bg-primary-50 mb-16">
                            <h6 class="mb-0">
                                Choose Your Language
                            </h6>
                        </div>

                        <div class="max-h-400-px overflow-y-auto scroll-sm pe-8">

                            <div class="form-check style-check mb-16">
                                <label class="form-check-label" for="english">
                                    <img src="{% static 'admin_assets/images/flags/flag1.png' %}"
                                        class="w-36 h-36 rounded-circle"
                                        alt="">
                                    English
                                </label>
                                <input class="form-check-input"
                                    type="radio"
                                    id="english">
                            </div>

                            <div class="form-check style-check mb-16">
                                <label class="form-check-label" for="india">
                                    <img src="{% static 'admin_assets/images/flags/flag7.png' %}"
                                        class="w-36 h-36 rounded-circle"
                                        alt="">
                                    India
                                </label>
                                <input class="form-check-input"
                                    type="radio"
                                    id="india">
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Notifications -->
                <div class="dropdown">

                    <button
                        class="has-indicator w-40-px h-40-px bg-neutral-200 rounded-circle d-flex justify-content-center align-items-center position-relative"
                        type="button"
                        data-bs-toggle="dropdown">

                        <iconify-icon icon="iconoir:bell"
                            class="text-primary-light text-xl">
                        </iconify-icon>

                        <span
                            class="w-8-px h-8-px bg-danger-600 position-absolute end-0 top-0 rounded-circle mt-2 me-2">
                        </span>

                    </button>

                    <div class="dropdown-menu dropdown-menu-lg to-top p-0">

                        <div class="m-16 py-12 px-16 radius-8 bg-primary-50 d-flex justify-content-between">
                            <h6 class="mb-0">
                                Notifications
                            </h6>

                            <span
                                class="text-primary-600 fw-semibold">
                                05
                            </span>
                        </div>

                        <div class="text-center py-12">
                            <a href="#"
                                class="text-primary-600 fw-semibold">
                                See All Notification
                            </a>
                        </div>

                    </div>

                </div>

                <!-- Profile -->
                <div class="dropdown">

                    <button
                        class="d-flex align-items-center gap-2"
                        data-bs-toggle="dropdown">

                        <img src="{% if request.user.profile_image %}{{ request.user.profile_image.url }}{% else %}{% static 'admin_assets/images/thumbs/leave-request-img2.png' %}{% endif %}"
                            class="w-40-px h-40-px rounded-circle object-fit-cover"
                            alt="Admin">

                        <div class="text-start">
                            <h6 class="mb-0 text-sm">
                                {% if request.user.is_authenticated %}{{ request.user.first_name|default:request.user.username|title }}{% else %}Guest User{% endif %}
                            </h6>
                            <small class="text-secondary-light text-xs d-block">
                                {% if request.user.is_superuser or request.user.role == 'admin' %}Administrator
                                {% elif request.user.role == 'institution' %}Institution Admin
                                {% elif request.user.employee_profile and request.user.employee_profile.designation %}{{ request.user.employee_profile.designation.title }}
                                {% else %}{{ request.user.role|default:"Staff"|title }}{% endif %}
                            </small>
                        </div>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <a class="dropdown-item" href="/admin-panel/view-profile/">
                                <i class="ri-user-3-line me-2"></i> My Profile
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <a class="dropdown-item text-danger" href="/admin-panel/logout/">
                                <i class="ri-shut-down-line me-2"></i> Log Out
                            </a>
                        </li>

                    </ul>

                </div>

            </div>
        </div>

    </div>
</div>
