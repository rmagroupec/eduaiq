{% load static %}
<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - EduAiQ</title>
    <link href="{% static 'admin_assets/images/favicon.png' %}" rel="icon" sizes="16x16" type="image/png"/>
    <link href="{% static 'admin_assets/css/remixicon.css' %}" rel="stylesheet"/>
    <link href="{% static 'admin_assets/css/lib/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #41246D;
            --accent: #F24080;
            --bg-color: #f6f5fb;
            --card-bg: #ffffff;
            --border-color: #e2e0ed;
            --text-main: #2b263b;
            --text-muted: #736f85;
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background matching website's theme */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(65, 36, 109, 0.06) 0%, rgba(255, 255, 255, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(242, 64, 128, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(65, 36, 109, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 64px rgba(65, 36, 109, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            max-height: 45px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input::placeholder {
            color: #b0adbe;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(65, 36, 109, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #523185 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(65, 36, 109, 0.15);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--accent) 0%, #df2f6f 100%);
            box-shadow: 0 8px 24px rgba(242, 64, 128, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img alt="EduAiQ Logo" src="{% static 'admin_assets/images/logo.png' %}"/>
            </div>
            <div class="login-header">
                <h2>Welcome Back 👋</h2>
                <p>Log in to your EduAiQ account to continue</p>
            </div>

            {% if form_errors %}
            <div class="alert alert-danger">
                {% for err in form_errors %}❌ {{ err }}<br>{% endfor %}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username or Email Address</label>
                    <input type="text" id="username" name="username" value="{{ old_username|default:'' }}"
                        placeholder="Enter your username or email" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password"
                            placeholder="Enter your password" required autocomplete="current-password" />
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" style="text-align:center;">Log in</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="{% url 'register' %}">Create account</a></p>
            </div>
        </div>
    </div>

    <script src="{% static 'admin_assets/js/lib/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'admin_assets/js/lib/bootstrap.bundle.min.js' %}"></script>
    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password i');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.classList.replace('ri-eye-line', 'ri-eye-off-line');
            } else {
                passwordField.type = 'password';
                toggleBtn.classList.replace('ri-eye-off-line', 'ri-eye-line');
            }
        }
    </script>
</body>
</html>
