{% load static %}
<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - EduAiQ</title>
    <link href="{% static 'admin_assets/images/favicon.png' %}" rel="icon" sizes="16x16" type="image/png"/>
    <link href="{% static 'admin_assets/css/remixicon.css' %}" rel="stylesheet"/>
    <link href="{% static 'admin_assets/css/lib/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'admin_assets/css/style.css' %}" rel="stylesheet"/>
    <style>
        .login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;}
        .login-card{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:40px;max-width:450px;width:100%;}
        .login-header{text-align:center;margin-bottom:30px;}
        .login-header h2{font-size:28px;font-weight:bold;color:#333;margin-bottom:10px;}
        .login-header p{color:#666;font-size:14px;}
        .form-group{margin-bottom:20px;}
        .form-group label{display:block;margin-bottom:8px;color:#333;font-weight:500;font-size:14px;}
        .form-group input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;box-sizing:border-box;}
        .password-wrapper{position:relative;}
        .toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;font-size:18px;padding:0;}
        .alert{padding:12px 16px;border-radius:4px;margin-bottom:20px;font-size:14px;}
        .alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
        .btn-login{width:100%;padding:12px;background:#0066cc;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:500;cursor:pointer;}
        .login-footer{text-align:center;margin-top:20px;}
        .login-footer a{color:#0066cc;text-decoration:none;}
        .logo{text-align:center;margin-bottom:20px;}
        .logo img{max-height:50px;}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img alt="EduAiQ Logo" src="{% static 'admin_assets/images/logo.png' %}"/>
            </div>
            <div class="login-header">
                <h2>Welcome Back 👋</h2>
                <p>Log in to your EduAiQ account to continue</p>
            </div>

            {% if form_errors %}
            <div class="alert alert-danger">
                {% for err in form_errors %}❌ {{ err }}<br>{% endfor %}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username or Email Address</label>
                    <input type="text" id="username" name="username" value="{{ old_username|default:'' }}"
                        placeholder="Enter your username or email" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password"
                            placeholder="Enter your password" required autocomplete="current-password" />
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" style="text-align:center;">Log in</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="{% url 'register' %}">Create account</a></p>
            </div>
        </div>
    </div>

    <script src="{% static 'admin_assets/js/lib/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'admin_assets/js/lib/bootstrap.bundle.min.js' %}"></script>
    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password i');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.classList.replace('ri-eye-line', 'ri-eye-off-line');
            } else {
                passwordField.type = 'password';
                toggleBtn.classList.replace('ri-eye-off-line', 'ri-eye-line');
            }
        }
    </script>
</body>
</html>
