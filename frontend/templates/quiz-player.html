{% extends 'base.html' %}
{% load static %}

{% block title %}Quiz Assessment - EduAiQ{% endblock %}

{% block content %}

<div class="quiz-player-page py-5" style="background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%); min-height: 90vh;">
  <div class="container" style="max-width: 800px;">
    
    <!-- Header Card -->
    <div class="quiz-header-card mb-4 p-4 bg-white rounded-4 shadow-sm border">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="quiz-icon-header d-flex align-items-center justify-content-center bg-primary text-white rounded-3 fs-4" style="width: 48px; height: 48px;">
            <i class="fas fa-clipboard-list"></i>
          </div>
          <div>
            <h4 id="quizTitle" class="fw-bold text-dark mb-1">Quiz Assessment</h4>
            <span class="badge bg-light text-primary border" style="font-size: 11px;">🛡️ AI Proctored & Encrypted</span>
          </div>
        </div>
        <div class="timer-badge-wrap bg-danger-subtle text-danger fw-bold fs-4 px-4 py-2 rounded-pill shadow-xs d-flex align-items-center">
          <i class="far fa-clock me-2"></i>
          <span id="timer">00:00</span>
        </div>
      </div>
    </div>

    <!-- Question Box -->
    <div id="questionContainer" class="card border-0 rounded-4 shadow-sm p-4 mb-4 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-indigo-subtle text-indigo fw-bold px-3 py-2 rounded-pill" id="questionCounterBadge" style="background-color: #e0e7ff; color: #4338ca;">Question 1</span>
        <span class="text-muted small fw-semibold"><i class="fas fa-shield-alt text-primary me-1"></i> Practice Assessment</span>
      </div>
      
      <h5 id="questionText" class="fw-bold text-dark mb-4 fs-5" style="line-height: 1.6;">Loading question...</h5>
      
      <div id="optionsContainer" class="d-flex flex-column gap-3">
        <!-- Options rendered dynamically -->
      </div>
    </div>

    <!-- Controls Card -->
    <div class="card border-0 rounded-4 shadow-sm p-3 mb-4 bg-white d-flex flex-row align-items-center justify-content-between">
      <button id="prevBtn" class="btn btn-outline-secondary px-4 fw-semibold rounded-3" onclick="previousQuestion()" disabled>
        <i class="fas fa-chevron-left me-1"></i> Previous
      </button>

      <span id="questionCounter" class="fw-bold text-secondary">1 / 1</span>

      <button id="nextBtn" class="btn btn-outline-secondary px-4 fw-semibold rounded-3" onclick="nextQuestion()">
        Next <i class="fas fa-chevron-right ms-1"></i>
      </button>
    </div>

    <div class="text-center">
      <button id="submitBtn" class="btn btn-success btn-lg px-5 py-3 fw-bold rounded-pill shadow-sm" onclick="submitQuiz()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none;">
        <i class="fas fa-paper-plane me-2"></i> Submit Final Quiz
      </button>
    </div>

  </div>
</div>

<!-- Results Modal -->
<div id="resultsModal" class="modal fade" tabindex="-1" style="display:none;">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 id="resultTitle" class="modal-title fw-bold">Quiz Results</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="scoreDisplay" class="text-center mb-4 p-4 rounded-4" style="background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);">
          <h1 id="scorePercentage" class="display-4 fw-bold text-primary mb-2">0%</h1>
          <p id="scoreMarks" class="fw-semibold text-dark mb-1">0 / 0 marks</p>
          <p id="timeTaken" class="text-muted small">Time: 0 minutes</p>
        </div>

        <div id="feedbackDisplay" class="feedback-section">
        </div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-primary px-4 rounded-pill" onclick="location.href='/my-learning/'">
          Back to Learning
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .option-card-row {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 16px 20px !important;
    background: #ffffff !important;
    border: 2px solid #e2e8f0 !important;
    border-radius: 12px !important;
    cursor: pointer !important;
    transition: all 0.2s ease-in-out !important;
    user-select: none !important;
  }
  .option-card-row:hover {
    border-color: #3b82f6 !important;
    background-color: #f0f7ff !important;
    transform: translateY(-1px);
  }
  .option-card-row.selected {
    border-color: #2563eb !important;
    background-color: #eff6ff !important;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12) !important;
  }
  .option-left-content {
    display: flex !important;
    align-items: center !important;
    gap: 14px !important;
  }
  .option-letter-badge {
    width: 36px !important;
    height: 36px !important;
    min-width: 36px !important;
    border-radius: 50% !important;
    background: #f1f5f9 !important;
    color: #475569 !important;
    font-weight: 700 !important;
    font-size: 14px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition: all 0.2s ease !important;
  }
  .option-card-row.selected .option-letter-badge {
    background: #2563eb !important;
    color: #ffffff !important;
  }
  .option-text-label {
    font-size: 15px !important;
    font-weight: 600 !important;
    color: #1e293b !important;
    margin: 0 !important;
  }
  .option-card-row.selected .option-text-label {
    color: #1e40af !important;
  }
  .timer-badge-wrap.warning {
    animation: pulseTimer 1s infinite;
  }
  @keyframes pulseTimer {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>

<script>
  const API_BASE_URL = window.location.origin;
  let quizId = new URLSearchParams(window.location.search).get('id');
  let attemptId = null;
  let answers = {};
  let questions = [];
  let timerInterval = null;
  let timeRemaining = 0;
  let currentQuestionIndex = 0;

  async function startQuiz() {
    try {
      const response = await fetch(`${API_BASE_URL}/courses/quizzes/${quizId}/start/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin'
      });

      const data = await response.json();

      if (data.error) {
        alert('Error: ' + data.error);
        window.location.href = '/courses/';
        return;
      }

      attemptId = data.attempt.id;
      questions = data.questions || [];
      timeRemaining = (data.time_limit_minutes || 15) * 60;

      document.getElementById('quizTitle').textContent = 'Quiz Assessment';

      if (questions.length === 0) {
        const qBox = document.getElementById('questionContainer');
        qBox.innerHTML = `
          <div class="text-center p-5">
            <div class="mb-3 text-warning" style="font-size: 48px;"><i class="fas fa-clipboard-list"></i></div>
            <h4 class="fw-bold text-dark">No Questions Available</h4>
            <p class="text-muted">This quiz does not have any questions added yet. Please check back soon.</p>
            <div class="mt-3">
              <a href="/courses/" class="btn btn-primary px-4 rounded-pill">Back to Courses</a>
            </div>
          </div>
        `;
        return;
      }

      displayQuestion(0);
      startTimer();

    } catch (error) {
      console.error('Error starting quiz:', error);
      alert('Failed to start quiz');
    }
  }

  function displayQuestion(index) {
    if (!questions || !questions[index]) return;
    const question = questions[index];

    document.getElementById('questionText').textContent = question.question_text || 'Question';
    if (document.getElementById('questionCounterBadge')) {
      document.getElementById('questionCounterBadge').textContent = `Question ${index + 1} of ${questions.length}`;
    }

    const optionsContainer = document.getElementById('optionsContainer');
    const selectedKey = answers[question.id];

    optionsContainer.innerHTML = Object.entries(question.options).map(([key, rawValue]) => {
      const optionValStr = `option_${key}`;
      const isSelected = (selectedKey === optionValStr);
      const letter = key.toUpperCase();

      let displayValue = (rawValue || '').trim();
      const regexPrefix = new RegExp(`^${key}\\s*[\\).\\s]*`, 'i');
      if (regexPrefix.test(displayValue)) {
        const stripped = displayValue.replace(regexPrefix, '').trim();
        if (stripped) {
          displayValue = stripped;
        }
      }

      return `
        <div class="option-card-row ${isSelected ? 'selected' : ''}" onclick="selectOptionCard(${question.id}, '${optionValStr}', this)">
          <div class="option-left-content">
            <div class="option-letter-badge">${letter}</div>
            <p class="option-text-label">${displayValue}</p>
          </div>
          ${isSelected ? '<i class="fas fa-check-circle text-primary fs-5"></i>' : '<div class="text-muted small" style="opacity: 0.3;"><i class="far fa-circle"></i></div>'}
        </div>
      `;
    }).join('');

    document.getElementById('questionCounter').textContent = `${index + 1} / ${questions.length}`;
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = index === questions.length - 1;

    currentQuestionIndex = index;
  }

  function selectOptionCard(questionId, selectedOption, cardElem) {
    answers[questionId] = selectedOption;
    const allCards = cardElem.parentElement.querySelectorAll('.option-card-row');
    allCards.forEach(c => {
      c.classList.remove('selected');
      const icon = c.querySelector('.fa-check-circle');
      if (icon) {
        icon.outerHTML = '<div class="text-muted small" style="opacity: 0.3;"><i class="far fa-circle"></i></div>';
      }
    });
    cardElem.classList.add('selected');
    const rightCircle = cardElem.querySelector('.fa-circle');
    if (rightCircle) {
      rightCircle.parentElement.outerHTML = '<i class="fas fa-check-circle text-primary fs-5"></i>';
    }
    submitAnswerToAPI(questionId, selectedOption);
  }

  async function submitAnswerToAPI(questionId, selectedOption) {
    try {
      await fetch(`${API_BASE_URL}/courses/attempts/${attemptId}/answer/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify({
          question_id: questionId,
          selected_option: selectedOption
        })
      });
    } catch (e) {
      console.error('Error submitting answer:', e);
    }
  }

  function previousQuestion() {
    if (currentQuestionIndex > 0) {
      displayQuestion(currentQuestionIndex - 1);
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex < questions.length - 1) {
      displayQuestion(currentQuestionIndex + 1);
    }
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeRemaining--;

      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;

      const timerElement = document.getElementById('timer');
      if (timerElement) {
        timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        if (timeRemaining <= 60) {
          timerElement.parentElement.classList.add('warning');
        }
      }

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        submitQuiz();
      }
    }, 1000);
  }

  async function submitQuiz() {
    clearInterval(timerInterval);

    try {
      const response = await fetch(`${API_BASE_URL}/courses/attempts/${attemptId}/submit/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin'
      });

      const data = await response.json();

      const attemptObj = data.result || data.attempt;
      if (attemptObj) {
        showResults(attemptObj);
      } else {
        alert('Failed to submit quiz: ' + (data.error || 'Unknown error'));
      }

    } catch (error) {
      console.error('Error submitting quiz:', error);
      alert('Failed to submit quiz');
    }
  }

  function showResults(attempt) {
    document.getElementById('scorePercentage').textContent = attempt.score_pct + '%';
    document.getElementById('scoreMarks').textContent = `${attempt.score_marks} marks`;
    document.getElementById('timeTaken').textContent = `Time taken: ${attempt.time_taken_minutes} minutes`;

    const feedbackDisplay = document.getElementById('feedbackDisplay');
    let feedbackHTML = `
      <div class="alert ${attempt.passed ? 'alert-success' : 'alert-warning'} text-center fw-bold fs-5 mb-4">
        ${attempt.passed ? '🎉 Congratulations! You Passed!' : '📚 Keep Learning! Practice makes perfect.'}
      </div>
    `;

    if (attempt.feedback && Object.keys(attempt.feedback).length > 0) {
      feedbackHTML += `<h6 class="fw-bold text-dark mb-3">Answer Explanations:</h6><div class="d-flex flex-column gap-2">`;
      Object.entries(attempt.feedback).forEach(([qId, explanation]) => {
        feedbackHTML += `
          <div class="p-3 bg-light rounded-3 border">
            <p class="mb-0 text-dark small fw-medium">${explanation}</p>
          </div>
        `;
      });
      feedbackHTML += `</div>`;
    }

    feedbackDisplay.innerHTML = feedbackHTML;

    const modal = new bootstrap.Modal(document.getElementById('resultsModal'));
    modal.show();
  }

  document.addEventListener('DOMContentLoaded', startQuiz);
</script>

{% endblock %}
